[project]
name = "autoclips-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av>=15,<17",
    "fastapi>=0.119,<1",
    "faster-whisper>=1.2,<2",
    "uvicorn>=0.38,<1",
    "yt-dlp>=2026.10.14,<2027",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "httpx>=0.28,<1",
    "ruff>=0.14,<1",
    "httpx2>=2.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
