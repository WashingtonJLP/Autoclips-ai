name: autoclips-ai
services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_USER: autoclips
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_example}
      POSTGRES_DB: autoclips
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U autoclips -d autoclips']
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 1g
  redis:
    image: redis:7.4-alpine
    command:
      [
        redis-server,
        --appendonly,
        'yes',
        --maxmemory,
        256mb,
        --maxmemory-policy,
        noeviction,
      ]
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    environment:
      MEDIA_ROOT: /media
      WHISPER_MODEL: tiny
      WHISPER_CPU_THREADS: '2'
      HF_HOME: /models
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:?Execute node scripts/setup-local.mjs}
      MEDIA_DOWNLOAD_HOSTS: ${MEDIA_DOWNLOAD_HOSTS:-}
      SOURCE_FEED_URLS: ${SOURCE_FEED_URLS:-[]}
    volumes: [./media:/media, models:/models]
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 4g
    cpus: 2
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: '3001'
      WORKER_URL: http://worker:8000
      DATABASE_URL: postgresql://autoclips:${POSTGRES_PASSWORD:-local_example}@postgres:5432/autoclips
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Execute node scripts/setup-local.mjs}
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:?Execute node scripts/setup-local.mjs}
      PLATFORM_TOKEN_KEY: ${PLATFORM_TOKEN_KEY:-}
      SOURCE_MANIFEST_URLS: ${SOURCE_MANIFEST_URLS:-[]}
      MEDIA_DOWNLOAD_HOSTS: ${MEDIA_DOWNLOAD_HOSTS:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
      TWITCH_ACCESS_TOKEN: ${TWITCH_ACCESS_TOKEN:-}
      VIMEO_ACCESS_TOKEN: ${VIMEO_ACCESS_TOKEN:-}
      MEDIA_DOWNLOAD_ENGINE: ${MEDIA_DOWNLOAD_ENGINE:-native}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_FREE_TIER_CONFIRMED: ${GEMINI_FREE_TIER_CONFIRMED:-false}
      GEMINI_DAILY_REQUEST_LIMIT: ${GEMINI_DAILY_REQUEST_LIMIT:-10}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      YOUTUBE_REDIRECT_URI: ${YOUTUBE_REDIRECT_URI:-http://localhost:3100/oauth/youtube}
      TIKTOK_CLIENT_ID: ${TIKTOK_CLIENT_ID:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      TIKTOK_REDIRECT_URI: ${TIKTOK_REDIRECT_URI:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-mock-v1}
      LLM_ALLOW_EXTERNAL: ${LLM_ALLOW_EXTERNAL:-false}
      LLM_ALLOW_PAID: ${LLM_ALLOW_PAID:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_INPUT_USD_PER_MILLION: ${LLM_INPUT_USD_PER_MILLION:-}
      LLM_OUTPUT_USD_PER_MILLION: ${LLM_OUTPUT_USD_PER_MILLION:-}
      LLM_OLLAMA_URL: ${LLM_OLLAMA_URL:-http://host.docker.internal:11434}
      LLM_MAX_INPUT_TOKENS: ${LLM_MAX_INPUT_TOKENS:-6000}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-1600}
      LLM_RUN_TOKEN_BUDGET: ${LLM_RUN_TOKEN_BUDGET:-30000}
      LLM_DAILY_TOKEN_BUDGET: ${LLM_DAILY_TOKEN_BUDGET:-100000}
      LLM_RUN_COST_MICROS: ${LLM_RUN_COST_MICROS:-0}
      LLM_DAILY_COST_MICROS: ${LLM_DAILY_COST_MICROS:-0}
      LLM_MAX_CHUNKS: ${LLM_MAX_CHUNKS:-8}
      LLM_MAX_CLIPS: ${LLM_MAX_CLIPS:-5}
      LLM_MIN_DURATION: ${LLM_MIN_DURATION:-5}
      LLM_MAX_DURATION: ${LLM_MAX_DURATION:-60}
      LLM_MIN_SCORE: ${LLM_MIN_SCORE:-4.5}
      LLM_FALLBACK: ${LLM_FALLBACK:-none}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
    ports: ['127.0.0.1:3101:3001']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      worker: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    environment:
      API_URL: http://api:3001
      HOSTNAME: 0.0.0.0
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Execute node scripts/setup-local.mjs}
      DASHBOARD_USER: ${DASHBOARD_USER:?Execute node scripts/setup-local.mjs}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Execute node scripts/setup-local.mjs}
    ports: ['127.0.0.1:3100:3000']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 768m
volumes:
  postgres_data:
  redis_data:
  models:
