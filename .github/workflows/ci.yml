name: Qualidade
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qualidade-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/worker-python
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install uv==0.13.6
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen ruff check --config pyproject.toml ../../scripts/create-selection-fixture.py
      - run: uv run --frozen ruff format --check --config pyproject.toml ../../scripts/create-selection-fixture.py
      - run: uv run --frozen pytest
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_FILE: compose.yaml:compose.test.yaml
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node scripts/setup-local.mjs
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: node --env-file=.env scripts/smoke.mjs
      - run: node --env-file=.env scripts/ports-smoke.mjs
      - name: Seleção simulada, orçamento e renderização
        env:
          SELECTION_FIXTURE_PATH: fixtures/selection-smoke.mp4
        run: |
          docker compose exec -T -e SELECTION_FIXTURE_PATH="$SELECTION_FIXTURE_PATH" worker python - < scripts/create-selection-fixture.py
          docker compose exec -T -e SELECTION_FIXTURE_PATH="$SELECTION_FIXTURE_PATH" api node scripts/selection-integration.cjs
      - run: curl --fail http://127.0.0.1:3100/api/health
      - if: always()
        run: docker compose logs --tail 100
      - if: always()
        run: docker compose down
